name: engineering-loop
version: 11.0.0
description: 'Dynamic graph orchestrator with LangGraph. Graph constructed per work item based on complexity, UI context, and tags. Parallel QA fan-out/fan-in. Auto-sizes by complexity. TDD per task. Verifier with discrimination sensor. BMAD ideation. Continuous decisions. Self-improving lessons. Local model support. Multi-project ready.'

# ============================================================
# MODEL — local OpenAI-compatible endpoint (llama.cpp, vLLM, etc.)
# ============================================================
model:
  base_url: "http://localhost:8000"
  model: "qwable-v2"
  temperature: 0.0
  max_tokens: 128000

# Per-stage model override (optional)
# model_overrides:
#   impl.code:
#     base_url: "http://localhost:8001"
#     model: "Jackrong/Qwopus3.6-27B-v2-GGUF"
#     max_tokens: 200000

# ============================================================
# FRAMEWORK PATHS — relative to {framework-root} (read-only)
# ============================================================
framework_skill_root: "skills"
framework_reference_root: "references"
framework_stage_root: "stages"
framework_template_path: "references/skill-templates.md"

# ============================================================
# PROJECT PATHS — relative to {loop-root} (override as needed)
# ============================================================
artifact_root: "artifacts"
log_root: "../_bmad-output/process-logs"
state_file: "state.json"
context_file: "context.md"

# Planning integration (optional — loop is planning-agnostic)
planning_framework: "bmad"
planning_artifacts_root: "../_bmad-output/implementation-artifacts"

# ============================================================
# AUTO-SIZING — complexity determines which stages are active
# ============================================================
auto_sizing:
  enabled: true
  heuristics:
    small:
      max_files: 3
      max_tasks: 3
      new_domains: false
      external_integrations: false
    medium:
      max_files: 10
      max_tasks: 8
      new_domains: false
      external_integrations: true
    large:
      min_files: 10
      min_tasks: 8
      new_domains: true
      external_integrations: true
    complex:
      ambiguity: true
      new_domains: true
      external_integrations: true

# ============================================================
# LOOP CONSTRAINTS — per-stage iteration limits
# ============================================================
constraints:
  max_init_bdd_attempts: 2
  max_init_ideate_attempts: 3
  max_init_refine_attempts: 5
  max_design_user_research_attempts: 2
  max_design_personas_attempts: 2
  max_design_info_arch_attempts: 2
  max_design_interaction_attempts: 2
  max_design_design_system_attempts: 2
  max_design_visual_design_attempts: 2
  max_arch_requirements_attempts: 2
  max_arch_solution_attempts: 2
  max_arch_review_attempts: 2
  max_impl_design_attempts: 2
  max_impl_code_attempts: 3
  max_verify_attempts: 3
  max_e2e_execute_attempts: 3
  max_smoke_test_attempts: 3
  max_qa_security_attempts: 2
  max_qa_api_contract_attempts: 2
  max_qa_performance_attempts: 2
  max_qa_static_attempts: 2
  max_qa_unit_attempts: 2
  max_qa_integration_attempts: 2
  max_qa_human_flow_attempts: 2
  max_qa_human_ux_attempts: 2
  max_deploy_prepare_attempts: 2
  max_doc_update_attempts: 2
  max_doc_decisions_attempts: 2
  max_doc_project_attempts: 2
  require_design_phase_large: true
  require_e2e_user_facing: true
  require_smoke_ui_projects: true
  e2e_locator_strategy: "role-based"  # Mandatory: getByRole, getByLabel, getByText
  e2e_console_error_gate: true        # Zero console errors required
  e2e_network_error_gate: true        # Zero 4xx/5xx required
  e2e_screenshot_on: true             # Always capture screenshots
  e2e_bdd_coverage_enforcement: true  # 1:1 BDD→E2E mandatory

# ============================================================
# QA POLICY — thresholds, failure routing, severity mapping
# ============================================================
qa_policy:
  # Heuristic QA thresholds (human.flow, human.ux)
  human:
    max_friction_score: 4             # Friction > this → FAIL
    min_confidence: 0.70              # Confidence < this → BLOCKED

  # Deterministic QA thresholds
  static:
    max_cyclomatic_complexity: 15     # Functions above this are flagged
    max_lint_errors: 0                # Zero lint errors required
    max_type_errors: 0                # Zero type errors required

  unit:
    min_coverage: 70                  # Minimum coverage percentage
    require_tests: true               # Must have at least one test

  integration:
    require_tests: true

  # Failure policy: what action to take per severity
  failure_policy:
    critical:
      action: rollback                # Reset impl.code, re-implement
    high:
      action: repair                  # Inline fix, re-verify
    medium:
      action: repair                  # Inline fix, re-verify
    low:
      action: continue                # Log warning, proceed
    info:
      action: continue

  # Retry policy for BLOCKED stages (infrastructure failures)
  retry_policy:
    max_attempts: 2                   # Max retries for BLOCKED stages
    backoff_seconds: 5                # Delay between retries

# ============================================================
# LOCAL HARDWARE MANAGEMENT
# ============================================================
hardware:
  context_window: 200000
  context_safety_margin: 0.15
  max_parallel_agents: 3
  agent_context_limit: 66666
  idle_timeout_seconds: 180     # Kill only when model produces no tokens for this long
  stage_timeout_seconds: 600   # Hard fallback — last resort when idle detection fails
  max_artifact_size_lines: 300
  max_findings_buffer: 50
  compact_log_after_iteration: 3

# ============================================================
# ESSENCE SIDECAR — runs BEFORE every stage
# ============================================================
essence:
  enabled: true
  skill: "essence"
  run_before_stage: true
  capture_decisions: true
  context_file: "context.md"

# ============================================================
# LOOP SAFETY LIMITS
# ============================================================
max_loop_iterations: 50
max_subagent_invocations_per_stage: 3
max_essence_retries_per_stage: 5

# ============================================================
# AGENT — sub-agent execution settings
# ============================================================
agent:
  max_agent_iterations: 25    # Max tool-use iterations per stage agent
  tool_timeout: 120            # Bash command timeout (seconds)
  # backend: "langchain"       # Default: LangChain tool-calling loop
  # backend: "opencode"        # Hybrid: Python controls graph, opencode executes with native tools
  # Use --opencode-agent CLI flag to enable, or set backend: "opencode" here
  stall_detection:
    enabled: true
    window_size: 10             # Number of recent calls to observe
    exact_repeat_threshold: 3   # Same tool + same args N times = stall
    same_tool_threshold: 10     # Same tool N times (any args) = stall
    no_progress_threshold: 8    # N calls without write/edit/bash = stall
    productive_tools:
      - write
      - edit
      - bash

# ============================================================
# SELF-CONSTRUCTION
# ============================================================
skill_creator: "skill-creator"
template_path: "references/skill-templates.md"

# ============================================================
# LESSONS — self-improving, shared across projects
# ============================================================
lessons:
  enabled: true
  local_file: "artifacts/lessons.json"
  rendered_file: "artifacts/LESSONS.md"
  shared_file: "artifacts/lessons-shared.json"
  pending_file: "artifacts/lessons-pending.json"
  confirm_threshold: 2

# ============================================================
# GRAPHIFY — knowledge graph integration (opt-in)
# ============================================================
graphify:
  enabled: false
  build_on_init: true
  build_on_commit: false
  update_after_impl: true
  skip_if_small: true

# ============================================================
# DYNAMIC GRAPH — construct graph per work item (v11)
# ============================================================
dynamic_graph:
  enabled: false             # Set true for dynamic graph construction
  parallel_qa: false         # Run QA stages in parallel (fan-out/fan-in)
  log_topology: true         # Save graph topology to state.json

# ============================================================
# STATE HISTORY — snapshots for time travel / rollback (v11.2)
# ============================================================
state_history:
  enabled: true              # Save snapshot after each stage
  retention_per_stage: 5     # Max snapshots to keep per stage
  history_dir: ".eng/history"  # Directory relative to loop root

# ============================================================
# COMPLIANCE — enforcement of topology rules (v11.1)
# ============================================================
compliance:
  enabled: true              # Enable compliance gate between stages
  mode: "gate"               # "gate" = blocking, "advisory" = warning only
  check_before_stage: true   # Run --check-compliance before each stage
  enforce_tool_scope: true   # Block tool calls not permitted for current stage
