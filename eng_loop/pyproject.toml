[project]
name = "eng-loop"
version = "10.4.0"
description = "Engineering Loop orchestrator — LangGraph-based AI development loop with Pydantic structured output and evidence gates"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
eng-loop = "eng_loop.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
